<!doctype html>
<html>
  <head>
    <title>Cookie Azul</title>
    <style>
	html {
    width: 340px;
}
      body {
      overflow: hidden;
      margin: 0px;
      background: white;color: #303030;
      }
      .btn {
      text-align: center;
      font-family: sans-serif;
      margin-top: 1px;
      background: #64c306;
      font-size: 12px;
      color: #ffffff;
      background-color: #64c306;
      border-color: #64c306;
      border: 0;
      padding: 5px 8px;
      border-radius: 3px;
      cursor: pointer;
      text-transform: uppercase;
      float: right;
      }
      .btn_gettoken {
      text-align: center;
      font-family: sans-serif;
      margin-top: 1px;
      background: #394959;
      font-size: 12px;
      color: #ffffff;
      background-color: #394959;
      border-color: #394959;
      border: 0;
      padding: 5px 8px;
      border-radius: 3px;
      cursor: pointer;
      text-transform: uppercase;
      float: right;
      }
      #start_plus:hover {
      background: #74C523;
      }
      #Stop_plus:hover {
      background: #E46A56;
      }
      .btn_red {
      background: #e64b32;
      color: white;
      }
      .row {
      width: 100%;
      float: left;
      margin-bottom: 10px;
      }
      label {
      font-size: 13px;
      font-family: arial;
      line-height: 1.5em;
      }
      .main {
      width: 320px;
      padding: 10px;
      }
      h4 {
      font-size: 14px;
      font-family: arial;
      color: #DB4437;
      border-bottom: solid 1px gainsboro;
      padding-bottom: 6px;
      margin: 0px 0px 10px 0;
      }
      #list_account {max-height: 420px;overflow: auto;    margin-top: 5px;}
      #list_account .acc {
      font-size: 12px;
      font-weight: bold;
      color: white;
      background: #00aaff;
      margin-bottom: 1px;
      padding: 5px;
      position: relative;
      cursor: default;
      }
      #list_account .acc-main {
      cursor: pointer;
      padding-right: 14px;
      }
      #list_account .acc-row2 {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 4px;
      }
      #list_account .acc-note {
      flex: 1 1 auto;
      min-width: 0;
      box-sizing: border-box;
      padding: 2px 5px;
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 2px;
      font-size: 10px;
      font-weight: normal;
      color: #303030;
      background: rgba(255,255,255,0.95);
      }
      #list_account .acc-note::placeholder { color: #8a8a8a; }
      #list_account .pagectl {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 2px;
      background: rgba(255,255,255,0.92);
      border-radius: 3px;
      padding: 1px 3px;
      }
      #list_account .pg-label {
      font-size: 9px;
      font-weight: bold;
      color: #394959;
      text-transform: uppercase;
      margin-right: 1px;
      }
      #list_account .pg-btn {
      border: 0;
      background: #394959;
      color: #fff;
      width: 17px;
      height: 17px;
      line-height: 1;
      border-radius: 2px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      padding: 0;
      }
      #list_account .pg-btn:hover { background: #00aaff; }
      #list_account .pg-val {
      min-width: 26px;
      text-align: center;
      font-size: 12px;
      font-weight: bold;
      color: #303030;
      }
      #list_account .pg-val.nao { color: #e64b32; }
      #list_account .acc-note:focus { outline: none; border-color: #394959; }
      #list_account .acc-note.saved { border-color: #64c306; box-shadow: 0 0 0 1px #64c306; }
      #list_account .acc:hover {
      background: #098cce;
      }

      #list_account .acc .delete {
      background: #e7505a;
      color: white;
      width: 11px;
      height: 14px;
      display: none;
      float: right;
      text-align: center;
      font-size: 10px;
      cursor: pointer;
      position: absolute;
      right: 0;
      top: 0;
      }
      #list_account .acc:hover .delete{
      display: inline-block;
      }
      #list_account .acc .delete:hover {
      background: #d42b36;
      }
      #list_account .acc .delete.confirm {
      display: inline-block;
      width: auto;
      padding: 0 4px;
      background: #64c306;
      }
      #list_account .acc.active {
      border-left: 4px solid #64c306;
      padding-left: 2px;
      }
      #list_account .acc.active .acc-main::after {
      content: " \2713 ativo";
      color: #eaffd0;
      font-size: 10px;
      font-weight: bold;
      }
      #btncookielogout{float:right;padding: 3px;}
      .header{
      float: left;
      width: 100%;
      }
    </style>

    <script src="jquery.min.js"></script>
    <script src="popup.js">
    </script>
  </head>
  <body>
    <div class="header">
      <div class=''>
        <h4 style="line-height: 24px;padding: 5px 5px 5px 10px;color:#64C306;">
          <img src="icon_128.png" style="width: 24px;margin-right: 5px;vertical-align: bottom;"/>
		  Cookie Azul
        </h4>
      </div>
    </div>
    <div class="main">
      <div class="row">
        <div style="clear: both;display: block;float: left;width: 100%;margin-bottom: 3px;">
          <input type='text' id='GetUidFromUrl' value='' placeholder='Obter ID a partir de um link do Facebook' style="width: 178px;padding: 2px 2px 2px 5px;"/>
          <button id="btngetidfromlink" type="button" style="padding: 4px 8px;" class="btn">Obter ID</button>
        </div>
		
        <label style="display:none;margin-bottom: 3px;" id="DivCurrentFacebookId">
          Facebook ID:
          <input type='text' id='CurrentFacebookId' value='' style="width: 158px;padding: 2px 2px 2px 5px;"/>
        </label>
        <label style="display:block;margin-bottom: 3px;">
          Cookie:
          <label id='CurrentCookieUrl' style="color: #05aafc;text-overflow: ellipsis;overflow: hidden;white-space: nowrap;max-width: 148px;display: inline-block;vertical-align: top;font-weight: bold;"></label>
        </label>
        <textarea id="cookieresult" rows="5" style="width:100%;word-break: break-all;"></textarea>
        <button id="btncookieimport" type="button" style="float:left;" class="btn">Importar</button>
        <button id="btngettoken" type="button" style="float:left;margin-left: 5px;" class="btn_gettoken">Obter Token</button>
        <button id="btncookiesave"  type="button" style=" background-color: #00aaff;display:none" class="btn">Salvar na lista</button>
      </div>
      <div class="row">
        <!--<label style="margin-top: 2px;display: inline-block;margin-bottom: 5px;">Select cookies</label>-->
        <div style="float: left;">
          <input type="checkbox" checked="checked" id="auto_save_fbaccount" style="margin-left:0px;"/>
          <label style="vertical-align: top;">Salvar Facebook</label>
        </div>

        <button id="btncookielogout" type="button" style="" class="btn btn_red">Entrar em nova conta do FB</button>
        <div class="row" id="list_account"></div>
      </div>
      <a title="Exportar todos os cookies (.txt)" href="javascript:void(0)" id='btnExportCookie' style="color: #206eab;">
        Exportar cookies
      </a>
      <a title="Backup da lista: contas + notas (.json)" href="javascript:void(0)" id='btnBackup' style="color: #206eab;margin-left: 12px;">
        Backup
      </a>
      <a title="Restaurar a lista de um arquivo de backup (.json)" href="javascript:void(0)" id='btnRestore' style="color: #206eab;margin-left: 12px;">
        Restaurar
      </a>
      <input type="file" id="restoreFile" accept="application/json,.json" style="display:none;" />
    </div>
  </body>
</html>
