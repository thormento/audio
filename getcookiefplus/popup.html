      }
      #list_account .acc-main {

      #list_account .acc-note {
      width: 100%;
      box-sizing: border-box;
      margin-top: 4px;
      padding: 3px 5px;
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 2px;
      font-size: 11px;
      font-weight: normal;
      color: #303030;
      background: rgba(255,255,255,0.95);
      }
      #list_account .acc-note::placeholder { color: #8a8a8a; }
      #list_account .acc-note:focus { outline: none; border-color: #394959; }
      #list_account .acc-note.saved { border-color: #64c306; box-shadow: 0 0 0 1px #64c306; }
      #list_account .acc:hover {
      background: #098cce;
      }

      #list_account .acc .delete {
      background: #e7505a;
      color: white;
      width: 11px;
      height: 14px;
      display: none;
      float: right;
      text-align: center;
      font-size: 10px;
      cursor: pointer;
      position: absolute;
      right: 0;
      top: 0;
      }
      #list_account .acc:hover .delete{
      display: inline-block;
      }
      #list_account .acc .delete:hover {
      background: #d42b36;
      }
      #btncookielogout{float:right;padding: 3px;}
      .header{
