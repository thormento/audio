<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        width: 260px;
        font: 14px -apple-system, system-ui, "Segoe UI", sans-serif;
        background: #ffffff;
        color: #1c1e21;
      }
      .cabecalho {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 14px 16px 10px;
      }
      .cabecalho img {
        width: 28px;
        height: 28px;
      }
      .cabecalho h1 {
        font-size: 15px;
        margin: 0;
        font-weight: 700;
      }
      .corpo {
        padding: 4px 16px 16px;
      }
      p.desc {
        margin: 0 0 12px;
        font-size: 12.5px;
        color: #606770;
        line-height: 1.4;
      }
      button {
        width: 100%;
        background: #1877f2;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 11px 12px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover {
        background: #166fe5;
      }
      button:active {
        transform: translateY(1px);
      }
      #status {
        margin-top: 10px;
        font-size: 12px;
        min-height: 16px;
        color: #606770;
      }
    </style>
  </head>
  <body>
    <div class="cabecalho">
      <img src="icons/icon48.png" alt="" />
      <h1>Criador de Páginas</h1>
    </div>
    <div class="corpo">
      <p class="desc">
        Abre a criação de Página do Facebook e cria uma página com nome
        aleatório e categoria automática.
      </p>
      <button id="criar">Criar página</button>
      <div id="status"></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
